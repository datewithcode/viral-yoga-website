# Netlify configuration. Netlify reads this automatically.
# Drag-and-drop: run `npm run build`, then drop the `dist` folder at https://app.netlify.com/drop
# Git deploy: connect the repo; the settings below are picked up.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Supabase project (Viral-Yoga, Mumbai). Both values are public by design:
  # the publishable key only works within the database's row-level security.
  PUBLIC_SUPABASE_URL = "https://sodtpweedjcvnvuomyzc.supabase.co"
  PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_MSDuW3g4WWG_T3GuHCor5g_Hg3MHSMM"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
