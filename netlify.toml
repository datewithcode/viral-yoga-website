# Netlify configuration. Netlify reads this automatically.
# Drag-and-drop: run `npm run build`, then drop the `dist` folder at https://app.netlify.com/drop
# Git deploy: connect the repo; the settings below are picked up.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
