name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build

  # Type-checks every Edge Function with the pinned imports in its deno.json.
  functions-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check
        run: |
          set -e
          for dir in supabase/functions/*/; do
            [ -f "$dir/index.ts" ] || continue
            echo "== $dir"
            (cd "$dir" && deno check index.ts)
          done

  # Runs the migrations on a fresh local Supabase, serves the functions with the
  # mock Razorpay/Resend server, and runs tests/functions.sh (payments,
  # webhook retries, member linking, rate limits, row level security).
  functions-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,logflare,vector,realtime,storage-api,mailpit,inbucket
      - run: bash tests/run.sh
      - if: always()
        run: supabase stop --no-backup
